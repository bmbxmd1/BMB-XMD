name: Auto Unzip Multi-Folder Project

on:
  push:
    paths:
      - 'project.zip'

jobs:
  unzip_process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Project Files
        run: |
          if [ ! -f "project.zip" ]; then
            echo "Error: project.zip missing!"
            exit 1
          fi

          mkdir temp_extracted
          unzip -o project.zip -d temp_extracted/
          
          INTERNAL_FOLDER=$(find temp_extracted -maxdepth 1 -mindepth 1 -type d | head -n 1)
          
          if [ -n "$INTERNAL_FOLDER" ]; then
            echo "Moving files from: $INTERNAL_FOLDER"
            mv "$INTERNAL_FOLDER"/* ./ 2>/dev/null || true
            mv "$INTERNAL_FOLDER"/.* ./ 2>/dev/null || true
          else
            mv temp_extracted/* ./ 2>/dev/null || true
            mv temp_extracted/.* ./ 2>/dev/null || true
          fi
          
          rm -rf temp_extracted
          rm -f project.zip

      - name: Commit and Push folders to Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Extract all sub-folders automatically" || exit 0
          git push
